<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wadi Degla - Season 25-26</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; }
        
        /* تعديلات الـ Navbar الجديدة */
        .navbar { display: flex; justify-content: space-between; align-items: center; background-color: #1a1a1a; padding: 12px 25px; border-bottom: 2px solid #2d2d2d; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .logo { height: 45px; }
        .header-titles { display: flex; flex-direction: column; align-items: center; }
        .header-titles h3 { margin: 0; font-weight: 700; color: #ffe102; font-size: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .header-titles .sub-title { margin-top: 5px; font-size: 13px; color: #a0a0a0; font-weight: 600; letter-spacing: 0.5px; }
        .header-titles .highlight { color: #fff; }
        
        .container { padding: 20px; max-width: 1200px; margin: auto; }
        .squad-section { background-color: #1e1e1e; border-radius: 12px; padding: 25px; box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
        .section-title { color: #d4d4d4; font-size: 17px; margin: 15px 0 20px 0; border-bottom: 2px solid #333; padding-bottom: 8px; font-weight: bold; }
        .players-grid { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
        
        /* تعديلات كروت اللاعبين مع تأثير الـ Glow */
        .player-card { display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: all 0.3s ease; padding: 12px; border-radius: 10px; width: 70px; background-color: transparent; }
        .player-card:hover { background-color: #252525; transform: translateY(-5px); box-shadow: 0 8px 15px rgba(102, 187, 106, 0.15); }
        .player-card img { width: 75px; height: 75px; border-radius: 50%; border: 3px solid #444; object-fit: cover; transition: border-color 0.3s; }
        .player-card:hover img { border-color: #f1da07; }
        .player-card span { color: #ccc; font-size: 13px; margin-top: 12px; font-weight: bold; text-align: center; transition: color 0.3s; }
        .player-card:hover span { color: #fff; }
        /* ====== الكود الذكي للموبايل والشاشات الصغيرة ====== */
        @media (max-width: 768px) {
            .players-grid {
                gap: 8px; /* تقليل الفراغات بين الكروت */
            }
            .player-card {
                /* إجبار المتصفح على عرض 3 كروت بالضبط في كل سطر */
                width: calc(33.33% - 12px); 
                padding: 8px 2px;
            }
            .player-card img {
                width: 65px; /* مقاس الصورة المناسب للتقسيمة الجديدة */
                height: 65px;
            }
            .player-card span {
                font-size: 11px; /* تصغير الخط قليلاً */
            }
        }
        
        /* النافذة المنبثقة */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); backdrop-filter: blur(8px); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: #151515; padding: 20px; border-radius: 12px; width: 90%; max-width: 850px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .close-btn { position: absolute; top: -15px; right: -15px; background: #ff4c4c; color: white; width: 35px; height: 35px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: bold; cursor: pointer; transition: 0.3s; z-index: 1001; border: 2px solid #151515; }
        .close-btn:hover { background: #ff1c1c; transform: scale(1.1); }
        .video-title { color: #f1da07; font-size: 18px; margin-bottom: 15px; font-weight: bold; text-align: right; }
        iframe { width: 100%; aspect-ratio: 16/9; border: none; border-radius: 8px; background-color: #000; }
    </style>
</head>
<body>

    <div class="navbar">
        <img src="assets/logo1.png" class="logo" alt="Logo" onerror="this.style.display='none'">
        <div class="header-titles">
            <h3>Wadi Degla - Season 25-26</h3>
            <div class="sub-title">Head Coach : <span class="highlight">Mohamed El Sheikh</span>  <span class="highlight"</span></div>
        </div>
        <img src="assets/logo2.png" class="logo" alt="Logo" onerror="this.style.display='none'">
    </div>

    <div class="container">
        <div class="squad-section" id="squadContainer"></div>
    </div>

    <div id="videoModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div class="video-title" id="playingTitle">▶ يعرض الآن</div>
            <iframe id="videoPlayer" src="" allowfullscreen></iframe>
        </div>
    </div>

    <!-- السطر ده هو اللي بيقرا الداتا -->
    <script src="data.js"></script>

    <script>
        const container = document.getElementById('squadContainer');
        const tacticalOrder = ["حراس المرمى", "المدافعين", "خط الوسط", "المهاجمين"];

        if (typeof playersData !== 'undefined') {
            tacticalOrder.forEach(position => {
                if (playersData[position] && playersData[position].length > 0) {
                    const players = playersData[position];
                    let sectionHTML = `<div class="section-title">${position}</div><div class="players-grid">`;
                    
                        players.forEach(player => {
                        let clickAction = player.videoLink && player.videoLink !== "رابط_الفيديو_هنا" 
                            ? `openVideo('${player.name}', '${player.videoLink}')` 
                            : `alert('لا يوجد فيديو متاح للاعب: ${player.name}')`;

                        sectionHTML += `
                            <div class="player-card" onclick="${clickAction}">
                                <!-- تم إضافة loading="lazy" هنا -->
                                <img src="${player.image}" loading="lazy" onerror="this.src='https://via.placeholder.com/65/222/FFF?text=N/A'">
                                <span>${player.name}</span>
                            </div>
                        `;
                    });
                    
                    sectionHTML += `</div>`;
                    container.innerHTML += sectionHTML;
                }
            });
        } else {
             container.innerHTML = `<div style="text-align: center; color: #ff4c4c; padding: 20px; font-weight: bold;">
                خطأ: لم يتم تحميل ملف البيانات data.js.<br><br>
                1. تأكد أن ملف data.js موجود بجوار ملف index.html مباشرة.<br>
                2. تأكد من فتح الموقع باستخدام إضافة Live Server.
             </div>`;
        }

        function openVideo(playerName, link) {
            const player = document.getElementById('videoPlayer');
            const modal = document.getElementById('videoModal');
            player.src = link; 
            document.getElementById('playingTitle').innerText = `▶ يعرض الآن: ${playerName}`;
            modal.style.display = "block"; 
            document.body.style.overflow = "hidden"; 
        }

        function closeModal() {
            const player = document.getElementById('videoPlayer');
            const modal = document.getElementById('videoModal');
            modal.style.display = "none"; 
            player.src = ""; 
            document.body.style.overflow = "auto"; 
        }

        window.onclick = function(event) {
            const modal = document.getElementById('videoModal');
            if (event.target == modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
